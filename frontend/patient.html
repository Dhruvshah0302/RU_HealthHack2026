<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Ask for help</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F7F9;
    --card: #FFFFFF;
    --ink: #10303B;
    --ink-soft: #46626C;
    --line: #C9D6DC;
    --nurse: #C8102E;
    --voice: #D7192F;
    --housekeeping_facilities: #1B7F5C;
    --food_services: #A65F00;
    --unit_clerk_it: #3A55A8;
    --nursebar-h: 7.5rem;
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
    line-height: 1.4; min-height: 100vh; overflow-x: hidden;
    display: flex; flex-direction: column;
    padding-bottom: var(--nursebar-h); /* room for the fixed nurse bar */
  }

  /* ---------- top: room on the left, Voice / Type switch in the centre ---------- */
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.75rem;
    padding: 1rem 1.25rem 0.5rem; width: 100%; max-width: 46rem; margin: 0 auto;
  }
  .room { font-size: 0.9rem; color: var(--ink-soft); white-space: nowrap; }
  .room b { color: var(--ink); font-size: 1.15rem; }

  .switch {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    background: #E2EAEE; border-radius: 999px; padding: 0.3rem;
    box-shadow: inset 0 1px 3px rgba(16, 48, 59, 0.15);
  }
  .switch .thumb {
    position: absolute; top: 0.3rem; bottom: 0.3rem; left: 0.3rem; width: calc(50% - 0.3rem);
    background: var(--ink); border-radius: 999px; transition: transform 0.25s ease;
  }
  .switch[data-mode="type"] .thumb { transform: translateX(100%); }
  .switch button {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 0.45rem;
    font: inherit; font-weight: 700; font-size: 1.1rem; min-width: 7.2rem; padding: 0.7rem 1.1rem;
    border: 0; border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer;
    transition: color 0.25s ease;
  }
  .switch button[aria-selected="true"] { color: #fff; }
  .switch svg { width: 1.2rem; height: 1.2rem; flex: none; }
  @media (prefers-reduced-motion: reduce) { .switch .thumb { transition: none; } }

  main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 46rem; margin: 0 auto; padding: 0 1.25rem; }
  h1 { font-size: clamp(1.6rem, 4.5vh, 2.2rem); line-height: 1.1; margin: 0.8rem 0 0.4rem; letter-spacing: -0.01em; text-align: center; }

  /* ---------- Voice view ---------- */
  #voiceView { flex: 1; display: flex; flex-direction: column; }
  .stage {
    --mic: clamp(9rem, min(60vw, 30vh), 16rem);
    --level: 0;                      /* 0..1 live loudness, set from JS */
    flex: 1; min-height: 0; display: grid; place-items: center; align-content: center;
    gap: calc(var(--mic) * 0.3 + 0.4rem);
    overflow: visible;
  }
  .mic-wrap { position: relative; width: var(--mic); height: var(--mic); }
  /* a glow that follows the voice directly, so loudness shows even with animations turned off */
  .halo {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(215, 25, 47, 0.30) 55%, rgba(215, 25, 47, 0) 72%);
    transform: scale(1); opacity: 0; transition: transform 0.08s linear, opacity 0.2s ease;
  }
  .listening .halo { opacity: 1; transform: scale(calc(1 + var(--level) * 0.5)); }
  .waves { position: absolute; inset: 0; pointer-events: none; }
  .wave {
    position: absolute; inset: 0; border-radius: 50%;
    border: 0.35rem solid var(--voice); background: rgba(215, 25, 47, 0.10);
    opacity: 0; animation: wave 1.3s cubic-bezier(0.15, 0.6, 0.3, 1) forwards;
  }
  /* --peak (how far it travels) and --alpha (how strong it starts) come from the live loudness */
  @keyframes wave {
    0%   { transform: scale(1);             opacity: var(--alpha, 0.5); }
    100% { transform: scale(var(--peak, 1.6)); opacity: 0; }
  }
  .guide {
    position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(16, 48, 59, 0.22);
    transform: scale(1.4); opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .listening .guide { opacity: 1; }

  .mic {
    position: relative; z-index: 1;
    width: 100%; height: 100%; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #F0404F, var(--voice) 60%, #A80E22);
    color: #fff; display: grid; place-items: center;
    box-shadow: 0 10px 28px rgba(200, 16, 46, 0.35), inset 0 -6px 14px rgba(0, 0, 0, 0.18);
    transition: transform 0.08s linear;
  }
  .mic svg { width: 38%; height: 38%; }
  .mic:active { transform: scale(0.97); }
  .mic:disabled { cursor: progress; opacity: 0.8; }
  .mic:focus-visible { outline: 5px solid #F2B705; outline-offset: 6px; }
  .listening .mic { transform: scale(calc(1 + var(--level) * 0.12)); }
  .working .mic { animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(0.94); } }
  @media (prefers-reduced-motion: reduce) {
    .wave { display: none; }           /* ripples off; the glow still follows the voice */
    .working .mic { animation: none; }
  }

  .voice-text { display: grid; gap: 0.3rem; text-align: center; position: relative; z-index: 2; }
  .voice-label { font-size: 1.5rem; font-weight: 700; margin: 0; min-height: 2.1rem; }
  .voice-sub { font-size: 1.05rem; color: var(--ink-soft); margin: 0; min-height: 1.5rem; }
  .voice-sub.quiet { color: #8A5A00; font-weight: 700; }
  .voice-sub.good { color: #1B7F5C; font-weight: 700; }

  /* ---------- Type view ---------- */
  #typeView { padding-bottom: 1rem; }
  label.field { display: block; font-size: 1rem; color: var(--ink-soft); margin: 0.75rem 0 0.4rem; }
  textarea {
    width: 100%; min-height: 6.5rem; resize: vertical; font: inherit; font-size: 1.3rem;
    padding: 0.9rem 1rem; border: 2px solid var(--ink); border-radius: 14px; background: var(--card);
    color: var(--ink);
  }
  .send {
    margin-top: 0.8rem; width: 100%; font: inherit; font-weight: 700; font-size: 1.35rem;
    padding: 1rem; border: 0; border-radius: 14px; background: var(--ink); color: #fff; cursor: pointer;
  }
  .send:disabled { opacity: 0.55; cursor: progress; }
  h2 { font-size: 1.05rem; font-weight: 400; color: var(--ink-soft); margin: 1.6rem 0 0.6rem; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.6rem; }
  .quick button {
    font: inherit; font-size: 1.15rem; text-align: left; padding: 0.85rem 1rem; cursor: pointer;
    background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
    border-left: 10px solid var(--stripe, var(--line));
  }
  .quick button:hover { border-color: var(--ink); border-left-color: var(--stripe, var(--ink)); }
  .quick button:disabled { opacity: 0.55; cursor: progress; }
  button:focus-visible, textarea:focus-visible { outline: 4px solid #F2B705; outline-offset: 3px; }

  .problem {
    background: #FFF4D6; border: 2px solid #B98900; border-radius: 14px; padding: 0.9rem 1rem;
    margin: 1rem 0 0; font-size: 1.1rem;
  }

  /* ---------- confirmation ---------- */
  #done h1 { margin-top: 1.5rem; text-align: left; }
  .sent { list-style: none; padding: 0; margin: 0 0 1.25rem; display: grid; gap: 0.7rem; }
  .sent li {
    background: var(--card); border-radius: 14px; padding: 1rem 1.1rem; font-size: 1.3rem;
    border-left: 14px solid var(--stripe);
  }
  .again {
    font: inherit; font-size: 1.15rem; padding: 0.85rem 1.2rem; border-radius: 14px; cursor: pointer;
    background: transparent; color: var(--ink); border: 2px solid var(--ink);
  }

  /* the nurse bar is on screen in both modes and never depends on the sorter */
  .nursebar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper);
    border-top: 2px solid var(--line); padding: 0.8rem 1.25rem 1rem; z-index: 5;
  }
  .nursebar button {
    display: block; width: 100%; max-width: 43.5rem; margin: 0 auto; font: inherit; font-weight: 700;
    font-size: 1.5rem; padding: 1.05rem; border: 0; border-radius: 14px; background: var(--nurse);
    color: #fff; cursor: pointer;
  }
  .nursebar p { max-width: 43.5rem; margin: 0.45rem auto 0; font-size: 0.85rem; color: var(--ink-soft); text-align: center; }
  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    header { grid-template-columns: 1fr; justify-items: center; gap: 0.4rem; }
    .switch button { min-width: 6.5rem; padding: 0.65rem 0.9rem; }
  }
  /* short screens (small phones): tighter top and a slimmer nurse bar, same button */
  @media (max-height: 720px) {
    :root { --nursebar-h: 5.6rem; }
    header { padding-top: 0.6rem; gap: 0.3rem; }
    .room { font-size: 0.8rem; }
    .switch button { padding: 0.5rem 0.8rem; font-size: 1rem; }
    h1 { margin: 0.4rem 0 0.2rem; }
    .voice-label { font-size: 1.3rem; min-height: 1.8rem; }
    .nursebar { padding: 0.6rem 1rem 0.6rem; }
    .nursebar button { font-size: 1.3rem; padding: 0.85rem; }
    .nursebar p { font-size: 0.75rem; margin-top: 0.3rem; }
    .stage { --mic: clamp(8.5rem, min(56vw, 28vh), 16rem); }
  }
</style>
</head>
<body>
<header>
  <div class="room"><span data-t="room">Room</span> <b id="room"></b></div>
  <div class="switch" id="switch" role="tablist" aria-label="How to ask" data-mode="voice">
    <span class="thumb" aria-hidden="true"></span>
    <button type="button" role="tab" id="tabVoice" aria-controls="voiceView" data-mode="voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/>
      </svg>
      <span data-t="modeVoice">Voice</span>
    </button>
    <button type="button" role="tab" id="tabType" aria-controls="typeView" data-mode="type">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 15.5h6"/>
      </svg>
      <span data-t="modeType">Type</span>
    </button>
  </div>
  <div></div>
</header>

<main>
  <section id="ask" style="display:flex;flex-direction:column;flex:1">
    <h1 data-t="title">What do you need?</h1>

    <!-- Voice: one big button in the middle of the page -->
    <div id="voiceView" role="tabpanel" aria-labelledby="tabVoice">
      <div class="stage" id="voice">
        <div class="mic-wrap">
          <span class="halo" aria-hidden="true"></span>
          <div class="waves" id="waves"></div>
          <span class="guide" aria-hidden="true"></span>
          <button class="mic" id="mic" type="button" aria-describedby="voiceLabel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/>
              <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/>
            </svg>
          </button>
        </div>
        <div class="voice-text">
          <p class="voice-label" id="voiceLabel" aria-live="polite"></p>
          <p class="voice-sub" id="voiceSub" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <!-- Type: text box and quick taps -->
    <div id="typeView" role="tabpanel" aria-labelledby="tabType" hidden>
      <form id="form">
        <label class="field" for="text" data-t="typeHint">Type it in your own words, in any language.</label>
        <textarea id="text" maxlength="600" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" data-t="send">Send request</button>
      </form>
      <h2 data-t="quickTitle">Or tap one</h2>
      <div class="quick" id="quick"></div>
    </div>

    <p class="problem" id="problem" role="alert" hidden></p>
  </section>

  <section id="done" aria-live="polite" hidden>
    <h1 id="doneTitle"></h1>
    <ul class="sent" id="sent"></ul>
    <button class="again" id="again" type="button" data-t="again">Ask for something else</button>
  </section>
</main>

<div class="nursebar">
  <button type="button" id="nurse" data-t="nurse">Call my nurse now</button>
  <p data-t="nurseHint">Pain, trouble breathing, or anything that feels wrong: press this.</p>
</div>

<script>
const T = {
  en: {
    room: "Room", title: "What do you need?", modeVoice: "Voice", modeType: "Type",
    typeHint: "Type it in your own words, in any language.",
    send: "Send request", sending: "Sending", quickTitle: "Or tap one", again: "Ask for something else",
    nurse: "Call my nurse now", nurseHint: "Pain, trouble breathing, or anything that feels wrong: press this.",
    speak: "Speak now", speakSub: "",
    listening: "Listening", listeningSub: "Tap again when you are done.",
    louder: "A little louder, please.", good: "Good, we can hear you.",
    working: "One moment",
    doneTitle: "We got it.", has: "has your request.",
    empty: "Type what you need, or tap one of the choices below.",
    failed: "That did not go through. Please use the call button on your bed.",
    dept: { nurse: "Nursing", housekeeping_facilities: "Housekeeping", food_services: "Food Services", unit_clerk_it: "The unit clerk" },
    quick: [
      ["food_services", "Water", "I would like some water."],
      ["housekeeping_facilities", "Blanket", "I need another blanket."],
      ["housekeeping_facilities", "Pillow", "I need an extra pillow."],
      ["housekeeping_facilities", "Clean my room", "My room needs cleaning."],
      ["unit_clerk_it", "TV or Wi-Fi help", "I need help with the TV or the Wi-Fi."],
      ["food_services", "Meal or snack", "I would like something to eat."],
    ],
  },
  es: {
    room: "Habitación", title: "¿Qué necesita?", modeVoice: "Voz", modeType: "Escribir",
    typeHint: "Escríbalo con sus propias palabras, en cualquier idioma.",
    send: "Enviar", sending: "Enviando", quickTitle: "O toque una opción", again: "Pedir otra cosa",
    nurse: "Llamar a mi enfermera ahora", nurseHint: "Dolor, dificultad para respirar o algo que no se sienta bien: presione aquí.",
    speak: "Hable ahora", speakSub: "",
    listening: "Escuchando", listeningSub: "Toque otra vez cuando termine.",
    louder: "Un poco más fuerte, por favor.", good: "Bien, le escuchamos.",
    working: "Un momento",
    doneTitle: "Recibido.", has: "tiene su pedido.",
    empty: "Escriba lo que necesita o toque una de las opciones.",
    failed: "No se pudo enviar. Por favor use el botón de llamada de su cama.",
    dept: { nurse: "Enfermería", housekeeping_facilities: "Limpieza", food_services: "Servicio de comidas", unit_clerk_it: "La recepción de la unidad" },
    quick: [
      ["food_services", "Agua", "Quisiera un poco de agua."],
      ["housekeeping_facilities", "Cobija", "Necesito otra cobija."],
      ["housekeeping_facilities", "Almohada", "Necesito otra almohada."],
      ["housekeeping_facilities", "Limpiar mi habitación", "Mi habitación necesita limpieza."],
      ["unit_clerk_it", "Ayuda con la TV o el Wi-Fi", "Necesito ayuda con la televisión o el Wi-Fi."],
      ["food_services", "Comida o merienda", "Quisiera algo de comer."],
    ],
  },
};

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const room = params.get("room") || "412";
const langTag = params.get("lang") || "en-US";                   // passed to speech services as given
const lang = langTag.toLowerCase().startsWith("es") ? "es" : "en";  // which screen text to show
let mode = params.get("mode") === "type" ? "type" : "voice";
$("room").textContent = room;

// Listening limits (SPEC: stop after 2 s of silence or 10 s in total).
const SILENCE_MS = 2000;
const MAX_LISTEN_MS = 10000;
// Loudness is measured in decibels: about -52 dB is a quiet room, -40 dB soft speech into a
// laptop microphone, -25 dB a clear speaking voice. These map to a 0..1 level.
const FLOOR_DB = -52, FULL_DB = -22;
const SPEECH_LEVEL = 0.28;             // level that counts as speech (about -43 dB)
const DEBUG = params.has("debug");      // ?debug=1 shows the live microphone reading
const QUIET_HINT_MS = 1500;            // this long without speech shows "a little louder"
const TRANSCRIBE_WAIT_MS = 10000;      // the server gives up on ElevenLabs at 8 s
const REQUEST_WAIT_MS = 8000;

let busy = false;

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  $("quick").replaceChildren(...t.quick.map(([dept, label, text]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.style.setProperty("--stripe", `var(--${dept})`);
    b.addEventListener("click", () => submit({ text }));
    return b;
  }));
  setMode(mode);
  setVoiceState("idle");
}

/* ---------------- Voice / Type switch ---------------- */
function setMode(next) {
  if (next !== "voice" && session) cancelListening();
  mode = next;
  $("switch").dataset.mode = mode;
  $("tabVoice").setAttribute("aria-selected", String(mode === "voice"));
  $("tabType").setAttribute("aria-selected", String(mode === "type"));
  $("tabVoice").tabIndex = mode === "voice" ? 0 : -1;
  $("tabType").tabIndex = mode === "type" ? 0 : -1;
  $("voiceView").hidden = mode !== "voice";
  $("typeView").hidden = mode !== "type";
  $("problem").hidden = true;
}
document.querySelectorAll(".switch button").forEach((b) => {
  b.addEventListener("click", () => {
    setMode(b.dataset.mode);
    if (mode === "type") $("text").focus();
  });
  b.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    setMode(mode === "voice" ? "type" : "voice");
    (mode === "voice" ? $("tabVoice") : $("tabType")).focus();
  });
});

/* ---------------- voice states ---------------- */
function setVoiceState(state) {
  const t = T[lang];
  const voice = $("voice");
  voice.classList.toggle("listening", state === "listening");
  voice.classList.toggle("working", state === "working");
  const [label, sub] = {
    idle: [t.speak, t.speakSub], listening: [t.listening, t.listeningSub], working: [t.working, ""],
  }[state];
  $("voiceLabel").textContent = label;
  setHint(sub, "");
  $("mic").setAttribute("aria-label", label);
  $("mic").disabled = state === "working";
  if (state !== "listening") $("voice").style.setProperty("--level", 0);
}

function setHint(text, tone) {
  const sub = $("voiceSub");
  if (sub.textContent !== text) sub.textContent = text;
  sub.className = "voice-sub" + (tone ? " " + tone : "");
}

function setBusy(on) {
  busy = on;
  $("send").disabled = on;
  $("send").textContent = on ? T[lang].sending : T[lang].send;
  document.querySelectorAll(".quick button").forEach((b) => { b.disabled = on; });
}

function showProblem(message) {
  $("problem").textContent = message;
  $("problem").hidden = false;
}

async function fetchWithin(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try { return await fetch(url, { ...options, signal: controller.signal }); }
  finally { clearTimeout(timer); }
}

async function postRequest(body) {
  const response = await fetchWithin("/api/requests", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  }, REQUEST_WAIT_MS);
  if (!response.ok) throw new Error(String(response.status));
  return response.json();
}

// Any failure on this page sends the request to the nurse instead.
async function submit({ text = "", direct_nurse = false }) {
  const t = T[lang];
  $("problem").hidden = true;
  if (!direct_nurse && !text.trim()) { showProblem(t.empty); $("text").focus(); return; }
  setBusy(true);
  try {
    let data;
    try {
      data = await postRequest({ room, text, direct_nurse });
    } catch (err) {
      if (direct_nurse) throw err;
      data = await postRequest({ room, text, direct_nurse: true });
    }
    showDone(data.tickets);
  } catch (err) {
    showProblem(t.failed);
  } finally {
    setBusy(false);
    setVoiceState("idle");
  }
}

function showDone(tickets) {
  const t = T[lang];
  $("doneTitle").textContent = t.doneTitle;
  $("sent").replaceChildren(...tickets.map((ticket) => {
    const li = document.createElement("li");
    li.style.setProperty("--stripe", `var(--${ticket.department})`);
    li.textContent = `${t.dept[ticket.department] || t.dept.nurse} ${t.has}`;
    return li;
  }));
  $("text").value = "";           // so a later nurse press never carries an old request
  $("ask").hidden = true; $("done").hidden = false;
  $("switch").hidden = true;
  $("again").focus();
}

/* ---------------- loudness waves ----------------
   Each wave is sized and coloured by how loud the patient is right now: quiet speech
   sends small, faint, slow ripples; a good speaking voice sends big, strong, frequent
   ones that pass the dashed guide circle. */
function emitWave(level) {
  const wave = document.createElement("span");
  wave.className = "wave";
  wave.style.setProperty("--peak", (1.22 + level * 0.5).toFixed(2));    // 1.22x .. 1.72x
  wave.style.setProperty("--alpha", (0.4 + level * 0.5).toFixed(2));
  wave.addEventListener("animationend", () => wave.remove());
  $("waves").append(wave);
  while ($("waves").childElementCount > 8) $("waves").firstElementChild.remove();
}

function showDebug(text) {
  let box = $("debug");
  if (!box) {
    box = document.createElement("pre"); box.id = "debug";
    box.style.cssText = "position:fixed;top:0;left:0;right:0;margin:0;padding:4px 8px;font:12px monospace;background:#000c;color:#0f0;z-index:9";
    document.body.append(box);
  }
  box.textContent = text;
}

/* ---------------- voice capture ----------------
   One press starts listening. We record audio for ElevenLabs and, at the same time,
   run Chrome's own speech recognition, so if ElevenLabs fails we already have a
   transcript without asking the patient to repeat. If neither understood anything,
   the press goes to the nurse, as a call bell does today. */

let session = null;

async function startListening() {
  if (busy || session) return;
  // Made inside the tap itself: created after the permission prompt, Chrome may start it paused,
  // and a paused meter hears only silence.
  let audio = null;
  try { audio = new AudioContext(); } catch (err) {}
  $("problem").hidden = true;

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (err) {
    if (audio) audio.close().catch(() => {});
    return submit({ text: "", direct_nurse: true });       // no microphone: the nurse gets the press
  }

  const now0 = performance.now();
  const s = {
    stream, chunks: [], heard: false, startedAt: now0, lastLoud: now0, lastWave: 0,
    browserText: "", recognition: null, recognitionEnded: null, audio,
  };
  session = s;

  // Recorder for ElevenLabs.
  try {
    s.recorder = new MediaRecorder(stream);
    s.recorder.ondataavailable = (e) => { if (e.data.size) s.chunks.push(e.data); };
    s.stopped = new Promise((resolve) => { s.recorder.onstop = resolve; });
    s.recorder.start();
  } catch (err) {
    s.recorder = null;
  }

  // Chrome speech recognition in parallel, as the fallback transcript.
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (Recognition) {
    try {
      const r = new Recognition();
      r.lang = langTag; r.continuous = true; r.interimResults = false;
      r.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) s.browserText += " " + e.results[i][0].transcript;
        }
      };
      r.onerror = () => {};
      s.recognitionEnded = new Promise((resolve) => { r.onend = resolve; });
      r.start();
      s.recognition = r;
    } catch (err) { s.recognition = null; }
  }

  if (!s.recorder && !s.recognition) {
    stopCapture(s); session = null;
    return submit({ text: "", direct_nurse: true });
  }

  // Loudness meter: drives the waves, the hint text and the silence cut-off.
  try {
    s.audio = audio || new AudioContext();
    if (s.audio.state === "suspended") s.audio.resume().catch(() => {});
    const analyser = s.audio.createAnalyser();
    analyser.fftSize = 1024;
    s.audio.createMediaStreamSource(stream).connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    let level = 0;
    s.meter = setInterval(() => {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (const v of buf) sum += v * v;
      const rms = Math.sqrt(sum / buf.length);
      const db = 20 * Math.log10(rms || 1e-6);
      const raw = Math.max(0, Math.min(1, (db - FLOOR_DB) / (FULL_DB - FLOOR_DB)));
      level = Math.max(raw, level * 0.85);                // fast attack, slow release
      const now = performance.now();
      $("voice").style.setProperty("--level", level.toFixed(3));

      if (raw > SPEECH_LEVEL) { s.heard = true; s.lastLoud = now; }
      // louder voice: waves come more often (every ~140 ms at full voice, ~600 ms when faint)
      if (level > 0.08 && now - s.lastWave > 600 - level * 460) { emitWave(level); s.lastWave = now; }
      if (DEBUG) showDebug(`audio ${s.audio.state} · mic ${stream.getAudioTracks()[0]?.muted ? "MUTED" : "on"} · ${db.toFixed(0)} dB · level ${level.toFixed(2)} · waves ${$("waves").childElementCount}`);

      const t = T[lang];
      if (now - s.lastLoud > QUIET_HINT_MS) setHint(t.louder, "quiet");
      else if (s.heard) setHint(t.good, "good");

      if (s.heard && now - s.lastLoud > SILENCE_MS) finishListening();
    }, 50);
  } catch (err) { if (DEBUG) showDebug("meter failed: " + err); /* the 10 s limit and the second tap still stop it */ }

  s.limit = setTimeout(finishListening, MAX_LISTEN_MS);
  setVoiceState("listening");
}

function stopCapture(s) {
  clearInterval(s.meter); clearTimeout(s.limit);
  if (s.recorder && s.recorder.state !== "inactive") { try { s.recorder.stop(); } catch (err) {} }
  if (s.recognition) { try { s.recognition.stop(); } catch (err) {} }
  s.stream.getTracks().forEach((track) => track.stop());
  if (s.audio) s.audio.close().catch(() => {});
}

// The patient switched to Type while listening: drop the recording, send nothing.
function cancelListening() {
  const s = session;
  if (!s || s.finishing) return;
  s.finishing = true;
  if (s.recognition) { try { s.recognition.abort(); } catch (err) {} s.recognition = null; }
  stopCapture(s);
  session = null;
  $("waves").replaceChildren();
  setVoiceState("idle");
}

const within = (promise, ms) => Promise.race([promise, new Promise((r) => setTimeout(r, ms))]);

async function finishListening() {
  const s = session;
  if (!s || s.finishing) return;
  s.finishing = true;
  setVoiceState("working");
  setBusy(true);

  clearInterval(s.meter); clearTimeout(s.limit);
  if (s.recorder && s.recorder.state !== "inactive") s.recorder.stop();
  if (s.recognition) { try { s.recognition.stop(); } catch (err) {} }
  await within(Promise.all([s.stopped, s.recognitionEnded].filter(Boolean)), 2000);
  stopCapture(s);
  session = null;

  let text = "";
  const blob = s.chunks.length ? new Blob(s.chunks, { type: s.recorder.mimeType || "audio/webm" }) : null;
  if (blob && blob.size) {
    try {
      const form = new FormData();
      form.append("file", blob, "request.webm");
      form.append("lang", langTag);
      const response = await fetchWithin("/api/transcribe", { method: "POST", body: form }, TRANSCRIBE_WAIT_MS);
      if (response.ok) text = ((await response.json()).text || "").trim();
    } catch (err) { /* fall back to the browser's transcript */ }
  }
  if (!text) text = s.browserText.trim();

  setBusy(false);
  // Nothing understood: the press goes to the nurse.
  await submit(text ? { text } : { text: "", direct_nurse: true });
}

$("mic").addEventListener("click", () => { if (session) finishListening(); else startListening(); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); submit({ text: $("text").value }); });
$("nurse").addEventListener("click", () => {
  if (session) cancelListening();
  submit({ text: mode === "type" ? $("text").value : "", direct_nurse: true });
});
$("again").addEventListener("click", () => {
  $("done").hidden = true; $("ask").hidden = false; $("switch").hidden = false;
  setVoiceState("idle");
});
render();
</script>
</body>
</html>
